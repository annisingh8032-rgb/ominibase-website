  $('intro').classList.add('off');mode='in';auto=false;
  tw={t0:now,dur:7,dc:0,c:curve([[1.3,0,3.6],[.4,0,1.6],[0,0,-1.5],[0,0,-5.2]]),g:null,
    done:function(){
      mode='rec';nodUntil=now+1.5;$('spin').classList.add('on');
      recUntil=now+2.5;
      say((LS.vis&&LS.vis.length?'Welcome back':'Hello')+(cfg.name?' '+cfg.name:'')+'! 😊 I\'m Aanya from the Ominibase reception. Which service are you here for?'+(LS.last!=null&&S[LS.last]?' (Last time: '+S[LS.last].n+'.)':'')+' Pick one below and I\'ll walk you to its chamber.')
    }}
};
function go(i){if(mode!=='rec')return;travel(route(i),i,-1)}
function goRoom(j){if(mode!=='room'||j===cur)return;var f=cur;travel(route2(f,j),j,f)}
function wa(m){if(CFG.whatsapp)window.open('https://wa.me/'+CFG.whatsapp+'?text='+encodeURIComponent(m),'_blank');else if(CFG.email)location.href='mailto:'+CFG.email+'?subject='+encodeURIComponent(m);else window.open('https://ominibase.online','_blank')}
function inr(n){return '₹'+n.toLocaleString('en-IN')}
function sec(t,h){return '<div class="mt">'+t+'</div>'+h}
function tags(a){return a.map(function(x){return '<span class="tag">'+x+'</span>'}).join('')}
var CP={single:{academy:[399,2100,3600],yoga:[450,2520,4200],gym:[499,2700,5160],library:[499,2700,5160]},double:{academy:[499,2700,5160],yoga:[549,3180,6000],gym:[599,3180,6360],library:[599,3180,6360]},multi:{academy:[799,4500,7200],yoga:[749,4200,6600],gym:[799,4500,7200],library:[799,4500,7200]}};
var CD=[['single','Single Device'],['double','2 Devices'],['multi','10 Devices']],CC=[['academy','Music/Art/Dance/Sport'],['yoga','Yoga/Martial Art'],['gym','Gym/Fitness'],['library','Library/Coaching']],CT=[['Monthly','1 Month',1],['Half Yearly','6 Months',6],['Yearly','12 Months',12]],cs={m:'software',d:'single',c:'academy'};
function chips(arr,cur,a){return '<div class="row cr">'+arr.map(function(x){return '<button class="chip'+(x[0]===cur?' on':'')+'" data-a="'+a+'" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'}
function cmsH(){var on=cs.m==='online',dv=on?'single':cs.d,pr=CP[dv][cs.c];
  return chips([['software','Software (Win/Mac)'],['online','Online (any device)']],cs.m,'cm')+(on?'':chips(CD,cs.d,'cd'))+chips(CC,cs.c,'cc')
  +CT.map(function(t,i){var a=pr[i]+(on?120:0),sv=pr[0]*t[2]-pr[i];
    return '<div class="pl'+(i===1?' hot':'')+'"><div class="ph"><b>'+t[0]+'</b><span>'+t[1]+(i===1?' · BEST VALUE':'')+'</span></div><div class="pp">'+inr(a)+(sv>0?'<em>Save '+inr(sv)+'</em>':'')+'</div><button class="btn pri" data-a="cb" data-v="'+i+'">Buy Now</button></div>'}).join('')}
function demoH(){var p=0,a=0;dSt.forEach(function(v){if(v===1)p++;else if(v===2)a++});var u=DEMO.length-p-a;
  return '<div class="dsum"><span><b>'+p+'</b>Present</span><span><b>'+a+'</b>Absent</span><span><b>'+u+'</b>Unmarked</span></div>'
  +'<div class="row cr"><button class="chip" data-a="dall">Mark all present</button><button class="chip" data-a="drs">Reset</button></div>'
  +DEMO.map(function(d,i){var v=dSt[i];return '<div class="dr"><span class="av">'+d[0].charAt(0)+'</span><span class="dn"><b>'+d[0]+'</b><span>Roll '+d[1]+' · Hip-Hop Batch</span>'+(v===2?'<button class="nt" data-a="dn" data-v="'+i+'">📲 Notify parent on WhatsApp</button>':'')+'</span><span class="dbs"><button class="db p'+(v===1?' on':'')+'" data-a="ds" data-v="'+i+':1">✓ Present</button><button class="db a'+(v===2?' on':'')+'" data-a="ds" data-v="'+i+':2">✗ Absent</button></span></div>'}).join('')}
function refreshDemo(){LS.demo=dSt.slice();LS.save();var b=$('demobox');if(b)b.innerHTML=demoH();refreshCards()}
function setSt(i,v){dSt[i]=dSt[i]===v?0:v;refreshDemo()}
function openRoom(i,from){LS.last=i;LS.vis=LS.vis||[];if(LS.vis.indexOf(i)<0)LS.vis.push(i);LS.save();
  mode='room';var s=S[i],h='';$('spin').classList.add('on');
  var nav='<div class="nav"><div class="nv"><b>Explore our services</b><span>Aanya will walk you to any chamber</span></div><div class="row">'+S.map(function(x,j){return j===i?'<button class="chip on" disabled aria-current="true">'+x.n+'</button>':'<button class="chip" data-a="go" data-v="'+j+'">'+x.n+'</button>'}).join('')+'</div></div>';
  h+=nav+'<h2>'+s.n+'</h2><div class="full">'+s.f+'</div><div class="tg">'+s.t+'</div><p>'+s.d+'</p>';
  if(s.stats)h+='<div class="st">'+s.stats.map(function(x){return '<div><b>'+x[0]+'</b>'+x[1]+'</div>'}).join('')+'</div>';
  h+=(function(){var I=['<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>','<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>','<path d="M4 5h16v11H9l-5 4z"/>','<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 3-6 6-6s6 2.5 6 6"/><path d="M16 5a3 3 0 010 6M18 14c2 .8 3 2.8 3 6"/>','<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>','<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>'];return '<div class="fg">'+s.feats.map(function(f,k){return '<div class="fc" style="--d:'+k+'"><i><svg viewBox="0 0 24 24">'+I[k%I.length]+'</svg></i><b>'+f+'</b>'+(s.fd&&s.fd[k]?'<small>'+s.fd[k]+'</small>':'')+'</div>'}).join('')+'</div>'})();
  if(s.demo)h+=sec('Try it live: mark attendance','<div class="kv">Demo class: Hip-Hop Batch · 7:00 AM. Tap Present or Absent here, or click the floating cards in the 3D room.</div><div id="demobox">'+demoH()+'</div>');
  if(s.mods)h+=sec('All modules',tags(s.mods));
  if(s.biz)h+=sec('Built for every kind of business',tags(s.biz));
  if(s.steps)h+=sec('How it works',s.steps.map(function(x,k){return '<div class="kv"><b>'+(k+1)+'. '+x[0]+'</b><br>'+x[1]+'</div>'}).join(''));
  if(s.info)h+=sec(i===4?'Contact':'Details',s.info.map(function(x){return '<div class="kv"><b>'+x[0]+':</b> '+x[1]+'</div>'}).join(''));
  if(s.forms)h+=sec('Form templates (₹100+)',tags(s.forms)+'<div class="kv">'+s.fnote+'</div>');
  if(s.work)h+=sec('Our recent work',s.work.map(function(x){return '<a class="wk" href="'+x[2]+'" target="_blank" rel="noopener"><b>'+x[0]+'</b><span>'+x[1]+'</span><i>Visit now →</i></a>'}).join(''));
  if(s.plans)h+=sec('Pricing plans',s.plans.map(function(p,k){return '<div class="pl'+(p[4]?' hot':'')+'"><div class="ph"><b>'+p[0]+(p[4]?' · POPULAR':'')+'</b><span>'+p[2]+'</span></div><div class="pp">'+p[1]+'<s>'+p[3]+'</s></div><ul>'+p[5].map(function(f){return '<li>'+f+'</li>'}).join('')+'</ul><button class="btn pri" data-a="pb" data-v="'+k+'">Buy Now</button></div>'}).join(''));
  if(s.cms)h+=sec('Ominibase price plan','<div id="cmsbox">'+cmsH()+'</div>');
  if(s.note)h+='<div class="use">'+s.note+'</div>';
  if(s.dl)h+=sec('Download / Open',s.dl.map(function(x){return '<a class="wk" href="'+x[1]+'" target="_blank" rel="noopener"><b>'+x[0]+'</b></a>'}).join(''));
  if(s.terms)h+=sec('Payment terms',s.terms.map(function(x,k){return '<div class="kv"><b>'+(k+1)+'. '+x[0]+':</b> '+x[1]+'</div>'}).join(''));
  if(s.why)h+=sec('Why choose this service?','<ul>'+s.why.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>');
  h+='<div class="use"><b>Who it is for:</b> '+s.u+'</div>';
  h+='<button class="btn pri" data-a="dm">'+(s.cta||'Book a '+s.n+' demo')+'</button>';
  if(s.faq)h+=sec('Frequently asked questions',s.faq.map(function(x){return '<details class="fq"><summary>'+x[0]+'</summary><p>'+x[1]+'</p></details>'}).join(''));
  h+='<small>Drag or use the 360° button to look all around.</small>';
  var R=$('room');R.innerHTML=h;R.scrollTop=0;R.classList.add('on');
  R.onclick=function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a'),v=b.getAttribute('data-v');
    if(a==='cm'||a==='cd'||a==='cc'){cs[a==='cm'?'m':a==='cd'?'d':'c']=v;$('cmsbox').innerHTML=cmsH()}
    else if(a==='cb'){var on=cs.m==='online',dv=on?'single':cs.d,t=CT[+v],pr=CP[dv][cs.c][+v]+(on?120:0),cat=CC.filter(function(c){return c[0]===cs.c})[0][1];
      wa("Hi, I'd like to get this CMS plan:\n\nVersion: "+(on?'Online (Any Device)':'Software (Windows / Mac)')+"\nCategory: "+cat+"\n"+(on?'':'Device: '+CD.filter(function(d){return d[0]===cs.d})[0][1]+"\n")+"Duration: "+t[1]+"\nPrice: "+inr(pr)+"\n\nPlease let me know the next steps.")}
    else if(a==='pb'){var p=s.plans[+v];wa('Hi, I want the '+s.n+' '+p[0]+' plan ('+p[2]+', '+p[1]+'). Please share the next steps.')}
    else if(a==='ds'){var q=v.split(':');setSt(+q[0],+q[1])}
    else if(a==='dall'){for(var z=0;z<dSt.length;z++)dSt[z]=1;refreshDemo()}
    else if(a==='drs'){for(var z2=0;z2<dSt.length;z2++)dSt[z2]=0;refreshDemo()}
    else if(a==='dn'){window.open('https://wa.me/?text='+encodeURIComponent('Hi, '+DEMO[+v][0]+' was absent from today\'s Hip-Hop batch (7:00 AM). Please let us know if everything is okay.'),'_blank')}
    else if(a==='go')goRoom(+v);
    else if(a==='dm')wa(s.msg||'Hi Ominibase, I would like a demo of '+s.n+'.')};
  nodUntil=now+1.5;
}
var ray=new THREE.Raycaster(),mv=new THREE.Vector2(),pd=null;
function pickCard(e){if(mode!=='room'||cur!==0)return null;mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);var h=ray.intersectObjects(dCards.map(function(c){return c.m}),false)[0];return h&&h.uv&&h.uv.y<.45?h:null}
function cardClick(e){var h=pickCard(e);if(!h)return;var c=dCards.filter(function(c){return c.m===h.object})[0];if(c)setSt(c.i,h.uv.x<.5?1:2)}

})();
</script>
